# The soak stack, Postgres by default. The MySQL variant layers
# docker-compose.mysql.yml on top of this file (see soak.sh).
# The database password is a throwaway for a local test database,
# settable through SOAK_PW and defaulted so the stack just runs.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: "${SOAK_PW:-soaktest}"
      POSTGRES_DB: soak
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "soak"]
      interval: 2s
      timeout: 2s
      retries: 30

  api1:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:${SOAK_PW:-soaktest}@db:5432/soak"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18081:8080"

  api2:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:${SOAK_PW:-soaktest}@db:5432/soak"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18082:8080"

  api3:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:${SOAK_PW:-soaktest}@db:5432/soak"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18083:8080"

  # The writers live behind the tools profile: `docker compose
  # --profile tools up writer0 writer1 writer2`, or ./soak.sh run.
  # They are pure HTTP clients; LOG_DIR is a shared volume so the
  # verifier (and hot-rows.json) can see every writer's log.
  writer0:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    command: ["writer"]
    profiles: ["tools"]
    environment:
      WRITER_NAME: writer-0
      SEED: "1000"
      OPS: "${OPS:-200}"
      API_URLS: "http://api1:8080,http://api2:8080,http://api3:8080"
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      - api1
      - api2
      - api3

  writer1:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    command: ["writer"]
    profiles: ["tools"]
    environment:
      WRITER_NAME: writer-1
      SEED: "2000"
      OPS: "${OPS:-200}"
      API_URLS: "http://api1:8080,http://api2:8080,http://api3:8080"
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      - api1
      - api2
      - api3

  writer2:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    command: ["writer"]
    profiles: ["tools"]
    environment:
      WRITER_NAME: writer-2
      SEED: "3000"
      OPS: "${OPS:-200}"
      API_URLS: "http://api1:8080,http://api2:8080,http://api3:8080"
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      - api1
      - api2
      - api3

  verify:
    build:
      context: ..
      dockerfile: soak/Dockerfile
    command: ["verify"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: "postgres://postgres:${SOAK_PW:-soaktest}@db:5432/soak"
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      - db
