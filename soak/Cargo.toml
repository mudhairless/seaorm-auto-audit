[package]
name = "seaorm-auto-audit-soak"
version = "0.1.0"
edition = "2021"
publish = false

# The cluster soak test for seaorm-auto-audit: a separate crate on
# purpose. It depends on the crate by path the way a real consumer
# would, and living outside the package keeps it out of the published
# crate. Local Docker only; it never runs in CI. See README.md here.

[dependencies]
seaorm-auto-audit = { path = "..", features = ["axum"] }
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "runtime-tokio-rustls",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
